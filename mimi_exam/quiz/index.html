<title>Quiz — Bible of Data Structures</title>
<style>
:root{
  --bg:#111;
  --card:#1a1a1a;
  --border:#2a2a2a;
  --txt:#e8e8e8;
  --muted:#666;
  --accent:#5865f2;
  --ok:#3ba55c;
  --err:#ed4245;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}

/* top bar */
nav{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;border-bottom:1px solid var(--border);background:var(--card)}
nav .home{font-weight:600;color:var(--muted);font-size:.85rem;letter-spacing:.04em}
nav .home:hover{color:var(--txt)}
nav .sep{color:var(--border)}
nav .topic{font-size:.85rem;color:var(--txt)}

/* topic grid on index */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;padding:2rem 1.5rem}
.tile{border:1px solid var(--border);border-radius:8px;padding:1.25rem 1.5rem;background:var(--card);cursor:pointer;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--accent);background:#1e1e2e}
.tile .num{font-size:.75rem;color:var(--muted);margin-bottom:.25rem;font-family:var(--mono)}
.tile .name{font-size:1.1rem;font-weight:600}
.tile .count{font-size:.8rem;color:var(--muted);margin-top:.25rem}

/* quiz page layout */
.page{max-width:780px;margin:0 auto;padding:2rem 1.5rem}
.page h1{font-size:1.3rem;font-weight:700;margin-bottom:1.75rem}

/* question card */
.q{border:1px solid var(--border);border-radius:8px;padding:1.25rem;margin-bottom:1.25rem;background:var(--card)}
.q-num{font-size:.75rem;color:var(--muted);font-family:var(--mono);margin-bottom:.5rem}
.q-text{font-size:.95rem;margin-bottom:1rem}
.opts{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.75rem}
.opt{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem .75rem;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.9rem;transition:border-color .1s,background .1s;user-select:none}
.opt:hover{border-color:#444}
.opt input{margin-top:3px;accent-color:var(--accent);flex-shrink:0}
.opt.ok{border-color:var(--ok);background:rgba(59,165,92,.12);color:#9ae6b4}
.opt.err{border-color:var(--err);background:rgba(237,66,69,.12);color:#fca5a5}
.check{background:var(--accent);color:#fff;border:none;padding:.45rem 1rem;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:600}
.check:hover{opacity:.9}
.exp{display:none;margin-top:.75rem;padding:.75rem;border-radius:6px;font-size:.85rem;line-height:1.5;border-left:3px solid var(--muted);background:#161616;color:var(--muted)}
.exp.show{display:block}
.exp.ok{border-color:var(--ok);color:#9ae6b4}
.exp.err{border-color:var(--err);color:#fca5a5}

/* code blocks */
pre{background:#0d0d0d;border:1px solid var(--border);border-radius:6px;padding:.75rem;overflow-x:auto;margin:.5rem 0}
pre code{font-family:var(--mono);font-size:.8rem;color:#c9d1d9}
code{font-family:var(--mono);font-size:.85em;background:#0d0d0d;padding:.1em .3em;border-radius:3px}

/* score bar */
.score-bar{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card)}
.score-bar span{font-size:.85rem;color:var(--muted)}
.score-bar strong{color:var(--txt)}
</style>
